<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121829">
<meta name="description" content="三皿焼いて総合勝負。その日の火と気温で、団扇の加減が変わる。">
<title>七輪 秋刀魚</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chokokutai&family=Dela+Gothic+One&family=M+PLUS+Rounded+1c:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#121829; --panel:rgba(243,234,216,.92); --panelInk:#1c1a17;
  --indigo:#26386a; --lantern:#c8332b; --ember:#ffa23a; --paper:#f3ead8; --ink:#1c1a17; --wood:#6b4a2b;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --panel:rgba(30,40,72,.9); --panelInk:#f3ead8; --paper:#1e2848; --ink:#f3ead8; }
}
:root[data-theme="dark"]{ --panel:rgba(30,40,72,.9); --panelInk:#f3ead8; --paper:#1e2848; --ink:#f3ead8; }
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
body{font-family:"M PLUS Rounded 1c",system-ui,-apple-system,"Hiragino Sans",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-tap-highlight-color:transparent}
canvas{position:fixed;inset:0;display:block;z-index:0}
#hud{z-index:3;position:fixed;top:calc(8px + env(safe-area-inset-top));left:0;right:0;display:grid;grid-template-columns:1fr auto 1fr;gap:8px;padding:0 10px;pointer-events:none;align-items:start}
.card{background:var(--panel);color:var(--panelInk);border-radius:12px;padding:7px 9px;border:2px solid transparent;transition:border-color .2s}
.card.hot{border-color:var(--ember);animation:pulse .5s infinite alternate}
@keyframes pulse{to{border-color:var(--lantern)}}
@media (prefers-reduced-motion:reduce){.card.hot{animation:none}}
.who{font-weight:800;font-size:13px;margin-bottom:2px}
.row{margin-top:3px}
.lbl{display:flex;justify-content:space-between;font-size:11px;line-height:1.2}
.bar{height:9px;background:rgba(0,0,0,.28);border-radius:5px;position:relative;overflow:hidden;margin-top:2px}
.zone{position:absolute;left:58.33%;width:16.67%;top:0;bottom:0;background:rgba(110,200,120,.55)}
.fill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:5px}
#timer{font-family:"Dela Gothic One",sans-serif;font-size:34px;color:var(--ember);text-shadow:0 3px 0 #000;min-width:62px;text-align:center;line-height:1}
#timer small{display:block;font-family:"M PLUS Rounded 1c";font-size:11px;color:#f3ead8;text-shadow:none;margin-top:2px;letter-spacing:.2em}
#wind{min-height:22px;padding:2px 9px;border-radius:11px;color:#f3ead8;background:rgba(38,56,106,.82);font-size:12px;font-weight:800;letter-spacing:.08em;opacity:0;transform:translateY(-5px);transition:opacity .2s,transform .2s;white-space:nowrap}
#wind.on{opacity:1;transform:translateY(0);animation:wind-shiver .36s ease-in-out infinite alternate}
@keyframes wind-shiver{to{transform:translateX(3px)}}
@media (prefers-reduced-motion:reduce){#wind.on{animation:none}}
#cpuSay{font-size:11px;margin-top:4px;min-height:14px;opacity:.85}
#pad{z-index:3;position:fixed;bottom:calc(14px + env(safe-area-inset-bottom));left:0;right:0;display:flex;gap:9px;justify-content:center;padding:0 12px}
#pad button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:15px 6px;flex:1;max-width:170px;min-height:56px;font-size:15px;color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.45);touch-action:none;transition:transform .08s ease,opacity .08s ease,box-shadow .08s ease}
#pad button:active,#pad button.is-pressed,#fan.on{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.45)}
#fan{background:var(--indigo)} #flip{background:var(--wood)} #serve{background:var(--lantern)}
button:focus-visible{outline:3px solid var(--ember);outline-offset:2px}
button:disabled{opacity:.35}
#center{justify-self:center;display:flex;flex-direction:column;align-items:center;gap:6px}
#sys{display:flex;gap:6px;pointer-events:auto}
.icon-btn{font:inherit;font-weight:800;font-size:15px;line-height:1;width:38px;height:38px;border:0;border-radius:11px;
  background:var(--panel);color:var(--panelInk);box-shadow:0 3px 0 rgba(0,0,0,.4);touch-action:manipulation;cursor:pointer}
.icon-btn:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.4)}
.icon-btn[aria-pressed="true"]{opacity:.5}
#pauseDlg{border:0;border-radius:20px;background:var(--paper);color:var(--ink);padding:22px 20px;max-width:320px;width:calc(100% - 40px)}
#pauseDlg::backdrop{background:rgba(10,12,24,.72)}
#pauseDlg h2{font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:24px;margin:0 0 14px;color:var(--lantern);text-align:center}
#pauseDlg .col{display:flex;flex-direction:column;gap:10px}
#pauseDlg .col .big{margin-top:0;width:100%}
.ov{z-index:5;position:fixed;inset:0;display:grid;place-items:center;background:rgba(10,12,24,.66);padding:20px}
.ov[hidden]{display:none}
.box{background:var(--paper);color:var(--ink);border-radius:20px;padding:24px 22px;max-width:350px;width:100%;text-align:center}
h1{display:flex;flex-direction:column;align-items:center;gap:10px;margin:0 0 14px;font-weight:400;line-height:1}
.brand{font-family:"Chokokutai","Hiragino Mincho ProN","Yu Mincho",serif;font-size:13px;letter-spacing:.62em;padding:5px 18px 5px calc(18px + .62em);color:#f3ead8;background:var(--lantern);box-shadow:3px 3px 0 #7a1c17}
.title-main{font-family:"Chokokutai","Hiragino Mincho ProN","Yu Mincho",serif;font-size:52px;letter-spacing:.28em;padding:2px 0 2px .28em;color:var(--ink);text-shadow:2px 0 0 #7a1c17,-2px 0 0 #7a1c17,0 2px 0 #7a1c17,0 -2px 0 #7a1c17,4px 4px 0 #4a1410;position:relative}
.title-main::before,.title-main::after{content:"";display:block;width:100%;height:3px;margin:0 auto;background:linear-gradient(90deg,transparent, #c9a227 12%, #f3ead8 50%, #c9a227 88%, transparent);box-shadow:0 1px 0 #7a1c17}
.title-main::before{margin-bottom:8px}
.title-main::after{margin-top:8px}
@media (max-width:380px){.title-main{font-size:42px}}
.box p{margin:6px 0;font-size:14px;line-height:1.6}
#today{font-size:13px;letter-spacing:.08em;opacity:.88;margin:2px 0 0}
.how{text-align:left;background:rgba(0,0,0,.07);border-radius:12px;padding:10px 12px;margin:12px 0;font-size:13px;line-height:1.75}
.big{font:inherit;font-weight:800;font-size:18px;border:0;border-radius:14px;padding:14px 26px;background:var(--lantern);color:#fff;box-shadow:0 5px 0 #7a1c17;margin-top:8px}
.big:active{transform:translateY(4px);box-shadow:0 1px 0 #7a1c17}
#verdict{font-family:"Dela Gothic One",sans-serif;font-size:30px;margin:0 0 8px;color:var(--lantern)}
#judgement{overflow:hidden;background:radial-gradient(circle at 50% 50%,rgba(248,210,112,.2),rgba(48,12,8,.88)),repeating-conic-gradient(from -8deg at 50% 50%,#a7271f 0deg 9deg,#e6b94e 9deg 18deg)}
#judgement .judge-board{position:relative;width:min(92vw,520px);padding:30px 18px 28px;text-align:center;color:#27120b;background:#ead8ae;border:8px double #3a160f;box-shadow:0 0 0 5px #d49b32,12px 14px 0 rgba(29,8,5,.55);transform:rotate(-1deg);animation:judge-in .48s cubic-bezier(.2,.9,.25,1.25)}
#judgement .judge-board::before,#judgement .judge-board::after{content:"★";position:absolute;top:9px;color:#a7271f;font-size:22px}
#judgement .judge-board::before{left:13px}#judgement .judge-board::after{right:13px}
.judge-kicker{font-family:"Chokokutai","Yu Mincho",serif;font-size:clamp(26px,7vw,46px);letter-spacing:.12em;color:#a7271f;text-shadow:2px 2px 0 #d8a83d;margin:0 0 10px}
.judge-winner{font-family:"Dela Gothic One","M PLUS Rounded 1c",sans-serif;font-size:clamp(24px,6.5vw,46px);line-height:1.25;letter-spacing:-.04em;white-space:nowrap;margin:0;padding:12px 2px;border-top:3px solid #3a160f;border-bottom:3px solid #3a160f}
.judge-stamp{display:inline-block;margin-top:15px;padding:4px 11px;border:3px solid #a7271f;color:#a7271f;font-family:"Chokokutai","Yu Mincho",serif;font-size:18px;letter-spacing:.2em;transform:rotate(-5deg)}
@keyframes judge-in{from{opacity:0;transform:scale(.55) rotate(5deg)}to{opacity:1;transform:scale(1) rotate(-1deg)}}
@media (prefers-reduced-motion:reduce){#judgement .judge-board{animation:none}}
.scores{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.sc{background:rgba(0,0,0,.07);border-radius:12px;padding:10px 6px}
.sc b{display:block;font-family:"Dela Gothic One",sans-serif;font-weight:400;font-size:34px;line-height:1.1}
.sc span{font-size:12px;display:block;line-height:1.5}
.best{font-size:13px;opacity:.8}.best b{font-size:18px}
#hud[hidden],#pad[hidden]{display:none!important}
#ending.ov{display:flex;flex-direction:column;justify-content:center;align-items:center;padding:12px 12px calc(16px + env(safe-area-inset-bottom));background:repeating-linear-gradient(0deg,transparent,transparent 3px,rgba(0,0,0,.05) 3px,rgba(0,0,0,.05) 6px),radial-gradient(ellipse 92% 72% at 50% 30%,#ffe19c 0%,#e07a32 36%,#5a2414 66%,#120c0a 100%)}
#ending.ov[hidden]{display:none}
.kage-stage{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:stretch}
.guests{display:grid;grid-template-columns:1fr 1fr 1fr;align-items:end;gap:2px;filter:drop-shadow(0 0 14px rgba(255,140,40,.4))}
.guest{opacity:.28;transform:translateY(10px);transition:opacity .35s ease,transform .35s ease;text-align:center}
.guest.on{opacity:1;transform:translateY(0)}
.guest svg{width:100%;height:auto;display:block;overflow:visible;fill:#0b0705;stroke:#0b0705;stroke-linecap:round;stroke-linejoin:round}
.guest .carve{fill:#d77a32;stroke:none;opacity:.82}
.guest .detail{fill:none;stroke:#d77a32;stroke-width:1.4;opacity:.78}
.guest .joint{fill:#b98a36;stroke:#2a1208;stroke-width:1.2}
.guest.eat svg{animation:kage-eat .42s ease}
@keyframes kage-eat{0%,100%{transform:none}40%{transform:rotate(-7deg) translateY(5px)}}
@media (prefers-reduced-motion:reduce){.guest,.guest.on{transition:none}.guest.eat svg{animation:none}}
.guest b{display:block;margin-top:2px;font-family:"Chokokutai","Hiragino Mincho ProN",serif;font-weight:400;font-size:12px;letter-spacing:.18em;color:#2a140c;text-shadow:0 1px 0 rgba(255,220,160,.35)}
.plates{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:4px 6px 10px}
.dish{position:relative;aspect-ratio:1.7/1;border-radius:50%;background:radial-gradient(ellipse at 50% 38%,#efe6d4 0%,#b9a48a 55%,#6d5a45 100%);box-shadow:0 6px 0 rgba(0,0,0,.25),inset 0 0 0 3px #c4b49a}
.dish .sanma{position:absolute;left:10%;right:10%;top:28%;width:80%;overflow:visible}
.dish .sanma{filter:drop-shadow(0 4px 2px rgba(40,20,8,.35))}
.dish.eaten .sanma{opacity:.22;transform:scale(.62);transform-origin:50% 50%;transition:opacity .4s,transform .4s}
.kage-who{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.kage-line{min-height:48px;margin:4px 0 8px;padding:8px 12px;text-align:center;font-size:15px;line-height:1.55;color:#1c120c;background:rgba(243,234,216,.55);border:1px solid rgba(90,40,20,.25)}
.kage-final{margin:0 0 8px;text-align:center;font-size:14px;line-height:1.5;color:#1c120c}
#ending .big{width:100%}
</style>

<body>

<div class="ov" id="title">
  <div class="box">
    <h1><span class="brand">七輪</span><span class="title-main">秋刀魚</span></h1>
    <p>三皿焼いて、総合で勝負。</p>
    <p id="today"></p>
    <div class="how">
      下を向いてる面が焼ける<br>
      団扇は加減。押しっぱなしは危険<br>
      バーの緑がベスト<br>
      三皿出して、客が食べる
    </div>
    <button class="big" id="startBtn">焼き始める</button>
  </div>
</div>

<div id="hud">
  <div class="card" id="pCard">
    <div class="who">あなた</div>
    <div class="row"><div class="lbl"><span id="pAl">A面</span></div><div class="bar"><div class="zone"></div><div class="fill" id="pA"></div></div></div>
    <div class="row"><div class="lbl"><span id="pBl">B面</span></div><div class="bar"><div class="zone"></div><div class="fill" id="pB"></div></div></div>
  </div>
  <div id="center">
    <div id="timer">54<small>一皿</small></div>
    <div id="wind" role="status" aria-live="polite"></div>
    <div id="sys">
      <button type="button" class="icon-btn" id="btnMute" aria-label="音の切り替え" aria-pressed="false">♪</button>
      <button type="button" class="icon-btn" id="btnPause" aria-label="一時停止">Ⅱ</button>
    </div>
  </div>
  <div class="card" id="cCard">
    <div class="who">焼き場のゲン</div>
    <div class="row"><div class="lbl"><span id="cAl">A面</span></div><div class="bar"><div class="zone"></div><div class="fill" id="cA"></div></div></div>
    <div class="row"><div class="lbl"><span id="cBl">B面</span></div><div class="bar"><div class="zone"></div><div class="fill" id="cB"></div></div></div>
    <div id="cpuSay"></div>
  </div>
</div>

<div id="pad">
  <button id="fan" disabled>団扇<br><small>加減</small></button>
  <button id="flip" disabled>ひっくり<br>返す</button>
  <button id="serve" disabled>焼き<br>上がり！</button>
</div>

<div class="ov" id="judgement" hidden>
  <div class="judge-board">
    <p class="judge-kicker">判定は！！！</p>
    <p class="judge-winner" id="judgeWinner">あなたの勝利！</p>
    <span class="judge-stamp">三皿勝負</span>
  </div>
</div>

<div class="ov" id="ending" hidden>
  <div class="kage-stage">
    <div class="guests">
      <div class="guest" id="g0">

          <path d="M44 58 Q57 67 72 60 L77 79 Q69 93 73 111 L85 164 25 164 38 109 Q43 90 36 75Z"/>
          <path d="M69 72 Q81 76 88 91 L96 113" fill="none" stroke-width="8"/><path d="M96 113 Q83 126 68 128" fill="none" stroke-width="6"/>
          <path d="M38 74 Q25 83 18 101 L9 119" fill="none" stroke-width="8"/><path d="M9 119 25 133" fill="none" stroke-width="6"/>
          <circle class="joint" cx="88" cy="91" r="4"/><circle class="joint" cx="18" cy="101" r="4"/>
          <circle class="carve" cx="70" cy="38" r="1.8"/><path class="detail" d="M50 79 Q58 88 67 79M45 94 Q56 104 70 94M40 112 Q56 122 75 111M35 131 Q56 142 79 130"/>
          <path class="carve" d="M49 70 55 75 49 80 43 75ZM63 70 69 75 63 80 57 75ZM49 101 55 106 49 111 43 106ZM66 119 72 124 66 129 60 124Z"/>
        </svg>
        <b>女優</b>
      </div>
      <div class="guest" id="g1">
        <svg viewBox="0 0 100 170" aria-hidden="true">
          <path d="M28 43 Q29 23 47 19 65 16 73 29 L88 34 75 40 Q75 53 65 60 L72 72 50 75 41 62 Q28 59 28 43Z"/>
          <path d="M48 58 Q42 72 31 79 19 91 20 111 L14 164 82 164 78 119 Q78 91 65 71Z"/>
          <path d="M65 78 Q80 84 84 99 L91 119" fill="none" stroke-width="8"/><path d="M91 119 70 132" fill="none" stroke-width="6"/>
          <path d="M31 83 Q20 92 12 111" fill="none" stroke-width="7"/><path d="M12 111 28 128" fill="none" stroke-width="6"/>
          <path d="M72 36 Q77 48 66 62 L60 70 Q53 57 54 48"/>

          <circle class="carve" cx="59" cy="34" r="1.7"/><path class="detail" d="M33 90 Q47 101 67 89M28 108 Q48 120 75 106M24 130 Q49 143 78 127"/>

          <circle class="joint" cx="15" cy="92" r="3.8"/><circle class="joint" cx="91" cy="91" r="3.8"/>
          <circle class="carve" cx="68" cy="34" r="1.7"/><path class="detail" d="M41 70 68 94M67 70 39 95M37 101 Q54 110 72 101"/>
          <path class="carve" d="M48 68 54 74 48 80 42 74ZM61 80 67 86 61 92 55 86ZM47 94 53 100 47 106 41 100Z"/>
        </svg>
        <b>小僧</b>
      </div>
    </div>
    <div class="plates" id="endPlates"></div>
    <div class="kage-who" id="endWho"></div>
    <div class="kage-line" id="endLine">三皿、お待ち。</div>
    <p class="kage-final" id="endFinal" hidden></p>
    <button class="big" id="againBtn" hidden>もう三皿</button>
  </div>
</div>

<dialog id="pauseDlg" aria-labelledby="pauseTitle">
  <h2 id="pauseTitle">一時停止</h2>
  <div class="col">
    <button type="button" class="big" id="btnResume">再開</button>
    <button type="button" class="big" id="btnMuteDlg">音: オン</button>
    <button type="button" class="big" id="btnQuit">タイトルへ</button>
  </div>
</dialog>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $=id=>document.getElementById(id);

// ---------- renderer / scene ----------
const renderer=new THREE.WebGLRenderer({antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
// 影を落とすライトが1つも無いためシャドウパスは常に空。有効のままだと状態切替の分だけ損をする
renderer.shadowMap.enabled=false;
document.body.appendChild(renderer.domElement); // DOM先頭はタイトルの開始ボタンに譲る（z-index:0で背面）
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x121829);
scene.fog=new THREE.Fog(0x121829,9,24);
const camera=new THREE.PerspectiveCamera(42,1,0.1,80);

scene.add(new THREE.HemisphereLight(0x6a7bb0,0x2a1a10,.55));
const moon=new THREE.DirectionalLight(0xa8b8ff,.35); moon.position.set(-4,8,3); scene.add(moon);

const table=new THREE.Mesh(new THREE.PlaneGeometry(40,40),new THREE.MeshStandardMaterial({color:0x3a2a1e,roughness:.92}));
table.rotation.x=-Math.PI/2; table.receiveShadow=true; scene.add(table);

// 提灯
const lanternMat=new THREE.MeshStandardMaterial({color:0xc8332b,emissive:0xc8332b,emissiveIntensity:.9,roughness:.6});
for(let i=0;i<6;i++){
  const l=new THREE.Mesh(new THREE.SphereGeometry(.45,20,14),lanternMat);
  l.scale.y=1.3; l.position.set(-7.5+i*3,2.6+Math.sin(i*1.7)*.3,-7); scene.add(l);
}

// ---------- helpers ----------
const STOPS=[[0,0xa9bccb],[40,0xd8cbb0],[65,0xd49a4a],[85,0x9a5a22],[102,0x4a2810],[125,0x120d0a]].map(([d,c])=>[d,new THREE.Color(c)]);
function dColor(d,out){
  d=Math.max(0,Math.min(125,d));
  for(let i=1;i<STOPS.length;i++){ if(d<=STOPS[i][0]){ const t=(d-STOPS[i-1][0])/(STOPS[i][0]-STOPS[i-1][0]); return out.copy(STOPS[i-1][1]).lerp(STOPS[i][1],t);} }
  return out.copy(STOPS[STOPS.length-1][1]);
}
const tmpC=new THREE.Color();
function radialTex(inner,outer){
  const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32); g.addColorStop(0,inner); g.addColorStop(1,outer);
  x.fillStyle=g; x.fillRect(0,0,64,64); return new THREE.CanvasTexture(c);
}

// ---------- サンマ ----------
function taper(geo){
  const p=geo.attributes.position;
  for(let i=0;i<p.count;i++){ const x=p.getX(i); const k=x<0?1+x*.6:1-x*x*.55; p.setY(i,p.getY(i)*k); p.setZ(i,p.getZ(i)*k); }
  geo.computeVertexNormals();
}
function makeFish(parent,yaw){
  const holder=new THREE.Group(); holder.rotation.y=yaw; holder.position.y=1.08; parent.add(holder);
  const flip=new THREE.Group(); holder.add(flip);
  const base={color:0x8ea6bd,roughness:.3,metalness:.45};
  const mA=new THREE.MeshStandardMaterial(base), mB=new THREE.MeshStandardMaterial(base);
  const gA=new THREE.SphereGeometry(1,40,16,0,Math.PI*2,0,Math.PI/2); taper(gA);
  const gB=new THREE.SphereGeometry(1,40,16,0,Math.PI*2,Math.PI/2,Math.PI/2); taper(gB);
  const body=new THREE.Group(); body.scale.set(.86,.07,.1);
  const top=new THREE.Mesh(gA,mA), bot=new THREE.Mesh(gB,mB); top.castShadow=bot.castShadow=true;
  body.add(top,bot); flip.add(body);
  const s=new THREE.Shape(); s.moveTo(0,0); s.lineTo(-.2,.1); s.quadraticCurveTo(-.1,0,-.2,-.1); s.lineTo(0,0);
  const tg=new THREE.ShapeGeometry(s); tg.rotateX(-Math.PI/2);
  const tailMat=new THREE.MeshStandardMaterial({color:0x8fa2b3,side:THREE.DoubleSide,roughness:.5});
  const tail=new THREE.Mesh(tg,tailMat); tail.position.x=-.8; flip.add(tail);
  const lineMat=new THREE.MeshStandardMaterial({color:0x56606c,roughness:.6,transparent:true,opacity:.8});
  for(const sy of [1,-1]){ const ln=new THREE.Mesh(new THREE.BoxGeometry(1.1,.006,.01),lineMat); ln.position.set(-.05,sy*.066,0); flip.add(ln); }
  const eyeA=new THREE.MeshStandardMaterial({color:0x111111,roughness:.2}), eyeB=eyeA.clone();
  const eA=new THREE.Mesh(new THREE.SphereGeometry(.028,12,10),eyeA); eA.position.set(.64,.036,.02); flip.add(eA);
  const eB=new THREE.Mesh(new THREE.SphereGeometry(.028,12,10),eyeB); eB.position.set(.64,-.036,.02); flip.add(eB);
  return {holder,flip,mA,mB,tailMat,eyeA,eyeB,lineMat};
}

// ---------- うちわ ----------
function uchiwaTex(){
  const c=document.createElement('canvas'); c.width=c.height=256; const x=c.getContext('2d');
  x.fillStyle='#f3ead8'; x.fillRect(0,0,256,256);
  x.strokeStyle='rgba(120,90,50,.28)'; x.lineWidth=2;
  for(let a=-80;a<=80;a+=10){ const r=a*Math.PI/180; x.beginPath(); x.moveTo(128,256); x.lineTo(128+Math.sin(r)*300,256-Math.cos(r)*300); x.stroke(); }
  x.fillStyle='#c8332b'; x.beginPath(); x.arc(128,105,54,0,Math.PI*2); x.fill();
  x.strokeStyle='#26386a'; x.lineWidth=10;
  for(let i=0;i<3;i++){ x.beginPath(); for(let px=0;px<=256;px+=8){ const py=185+i*20+Math.sin(px/20+i)*7; px?x.lineTo(px,py):x.moveTo(px,py);} x.stroke(); }
  return new THREE.CanvasTexture(c);
}
const uTex=uchiwaTex();
function makeUchiwa(parent,side){
  const pivot=new THREE.Group(); pivot.position.set(side*.98,.15,.95); pivot.rotation.y=Math.atan2(-side,-1); parent.add(pivot);
  const arm=new THREE.Group(); pivot.add(arm);

  arm.traverse(o=>{o.castShadow=true;});
  return {arm,side,phase:0};

const smokeTex=radialTex('rgba(255,255,255,.85)','rgba(255,255,255,0)');
const sparkTex=radialTex('rgba(255,230,160,1)','rgba(255,110,0,0)');
const parts=[];
for(let i=0;i<90;i++){
  const spark=i>=60;
  const m=new THREE.SpriteMaterial({map:spark?sparkTex:smokeTex,transparent:true,depthWrite:false,opacity:0,blending:spark?THREE.AdditiveBlending:THREE.NormalBlending});
  const sp=new THREE.Sprite(m); sp.visible=false; scene.add(sp);
  parts.push({sp,m,spark,life:0,max:1,v:new THREE.Vector3(),s0:.2,op:.5});
}
function spawn(spark,x,y,z,dark){
  const p=parts.find(q=>q.spark===spark&&q.life<=0); if(!p)return;
  p.life=p.max=spark?.5+Math.random()*.4:1.6+Math.random()*1.2;
  p.sp.position.set(x,y,z); p.sp.visible=true;
  if(spark){ p.v.set((Math.random()-.5)*.8,1.4+Math.random()*1.4,(Math.random()-.5)*.8); p.s0=.05+Math.random()*.05; p.op=1; }
  else{ p.v.set((Math.random()-.5)*.25,.55+Math.random()*.35,(Math.random()-.5)*.25); p.s0=.25+Math.random()*.2;
    p.m.color.set(dark?0x2b2622:0xd9dde6); p.op=dark?.7:.38; }
}
function updateParts(dt){
  for(const p of parts){
    if(p.life<=0)continue; p.life-=dt;
    if(p.life<=0){p.sp.visible=false;continue;}
    p.sp.position.addScaledVector(p.v,dt);
    const t=1-p.life/p.max;
    p.sp.scale.setScalar(p.spark?p.s0:p.s0*(1+t*2.8));
    p.m.opacity=p.op*(p.spark?(1-t):Math.sin(t*Math.PI));
  }
}

// ---------- audio ----------
const LS={muted:'tg.241.muted',best:'tg.241.best'};
function lsGet(k,d){ try{ const v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,String(v)); }catch(e){} }
let muted = lsGet(LS.muted,'0')==='1';
let actx=null,sizGain=null,noiseBuf=null;
function initAudio(){
  if(actx)return;
  try{
    actx=new (window.AudioContext||window.webkitAudioContext)();
    const len=actx.sampleRate*2, buf=actx.createBuffer(1,len,actx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*(Math.random()<.03?1:.3);
    noiseBuf=buf;
    const src=actx.createBufferSource(); src.buffer=buf; src.loop=true;
    const hp=actx.createBiquadFilter(); hp.type='highpass'; hp.frequency.value=2200;
    sizGain=actx.createGain(); sizGain.gain.value=0;
    src.connect(hp).connect(sizGain).connect(actx.destination); src.start();
  }catch(e){actx=null;}
}
let sizzleKick=0, lastFlapMs=0, flapBusy=0, flapPhase=0;
function playFlap(busy){
  if(!actx||!noiseBuf||muted) return;
  if(actx.state==='suspended'){ actx.resume().catch(()=>{}); }
  const t=actx.currentTime;
  const n=1+(busy>.35?1:0)+(busy>.75?1:0);
  for(let i=0;i<n;i++){
    const at=t+i*(.016-busy*.008);
    const src=actx.createBufferSource(); src.buffer=noiseBuf;
    const bp=actx.createBiquadFilter(); bp.type='bandpass';
    bp.frequency.value=780+busy*1100+i*220; bp.Q.value=1.6+busy;
    const g=actx.createGain();
    const peak=(.07+.05*busy)/(1+i*.35);
    g.gain.setValueAtTime(0,at);
    g.gain.linearRampToValueAtTime(peak,at+.01);
    g.gain.exponentialRampToValueAtTime(.001,at+.055+busy*.02);
    src.connect(bp).connect(g).connect(actx.destination);
    src.start(at); src.stop(at+.09);
  }
  const o=actx.createOscillator(); o.type='triangle'; o.frequency.value=170+busy*90;
  const og=actx.createGain();
  og.gain.setValueAtTime(.035+.03*busy,t);
  og.gain.exponentialRampToValueAtTime(.001,t+.035);
  o.connect(og).connect(actx.destination); o.start(t); o.stop(t+.05);
}
function flapNow(){
  const ms=performance.now();
  const gap=ms-lastFlapMs;
  if(gap<36){ flapBusy=Math.min(1,flapBusy+.2); return; }
  lastFlapMs=ms;
  const hit=Math.max(0,Math.min(1,(240-gap)/210));
  flapBusy=Math.min(1, flapBusy*.62+hit);
  playFlap(flapBusy);
}

// ---------- その日の火と気温（日付で固定。ゲージは出さない） ----------
const PLATES=3, ROUND=54, BASE=3.15, HEAT_MAX=1.25, DISH=['一皿','二皿','三皿'];
function todayKey(){ const d=new Date(); return d.getFullYear()*10000+(d.getMonth()+1)*100+d.getDate(); }
function hash01(n){ n=((n|0)*2654435761)>>>0; return n/4294967296; }
function makeDay(seed){
  const r1=hash01(seed+17), r2=hash01(seed+91);
  const fireI=r1<.34?0:r1<.67?1:2;
  const fires=[{name:'弱め',rest:.2,mul:.74},{name:'いつもの',rest:.46,mul:1},{name:'強め',rest:.7,mul:1.16}];
  const temp=Math.round(16+r2*18);
  return {seed,fireI,temp,settle:.5+(34-temp)/18*1.4,leak:.05+(temp-16)/18*.12,fanPush:.72,...fires[fireI]};
}
const day=makeDay(todayKey());
$('today').textContent='本日　'+day.name+'の火　／　'+day.temp+'℃';

function newCook(){return{dA:0,dB:0,flipped:false,rot:0,heat:day.rest,served:false,serveT:0,flipCd:0};}
const player={cook:newCook(),plates:[]}, cpu={cook:newCook(),plates:[]};
let state='title', timeLeft=ROUND, now=0, endTimer=0, holding=false;
const WIND_BOOST=1.38;
let windActive=false, windUntil=0, nextWindAt=0;

function scheduleWind(){ nextWindAt=now+9+Math.random()*9; }
function stopWind(){
  windActive=false; windUntil=0;
  $('wind').classList.remove('on'); $('wind').textContent='';
}
function updateWind(){
  if(windActive){
    if(now>=windUntil){ stopWind(); scheduleWind(); }
    return;
  }
  if(now>=nextWindAt){
    windActive=true; windUntil=now+3+Math.random()*2;
    $('wind').textContent='彡 風だ！ 焼き加速'; $('wind').classList.add('on');
    sizzleKick=Math.max(sizzleKick,.18);
    if(navigator.vibrate) navigator.vibrate([18,35,18]);
  }
}

function doFlip(c){ if(c.served||c.flipCd>0)return; c.flipped=!c.flipped; c.flipCd=.45; sizzleKick=.12; }
function cookStep(c,dt,fanning){
  c.flipCd=Math.max(0,c.flipCd-dt);
  if(fanning) c.heat=Math.min(HEAT_MAX,c.heat+day.fanPush*dt);
  else c.heat+=(day.rest-c.heat)*dt*day.settle;
  if(c.served) return;
  const rate=BASE*(.5+c.heat)*day.mul*(windActive?WIND_BOOST:1);
  if(c.flipped){ c.dA+=rate*dt; c.dB+=rate*day.leak*dt; } else { c.dB+=rate*dt; c.dA+=rate*day.leak*dt; }
}

function say(t){ $('cpuSay').textContent=t; }
function weatherLine(){
  if(day.fireI===2) return '今日は火が強い。団扇は軽くね';
  if(day.fireI===0) return '火が弱い。団扇で起こしてけ';
  if(day.temp>=28) return '暑い日は火が残りやすい';
  if(day.temp<=18) return '冷えてる。火が逃げやすいぞ';
  return 'いつもの火だ。加減で勝負';
}
function resetCpu(){
  cpu.t1=74+Math.random()*12; cpu.t2=74+Math.random()*12;
  cpu.pending=null; cpu.nextThink=0; cpu.fanning=false;
}
function cpuThink(dt){
  const c=cpu.cook; if(c.served)return;
  if(cpu.pending&&now>=cpu.pending.at){
    const a=cpu.pending.a; cpu.pending=null;
    if(a==='flip'){ doFlip(c); say('よっと、返すぜ'); }
    else { closePlate(cpu); say('ほい、'+DISH[cpu.plates.length-1]); }
  }
  if(now<cpu.nextThink)return; cpu.nextThink=now+.25;
  if(c.heat>0.7) cpu.fanning=false;
  else if(c.heat<0.5) cpu.fanning=true;
  else if(Math.random()<.12) cpu.fanning=!cpu.fanning;
  if(!cpu.pending){
    if(!c.flipped&&c.dB>=cpu.t1){
      const slow=Math.random()<.18;
      cpu.pending={a:'flip',at:now+(slow?1.6+Math.random()*1.8:.2+Math.random()*.6)};
      if(slow) say('……おっと、よそ見しちまった');
    }else if(c.flipped&&c.dA>=cpu.t2){
      cpu.pending={a:'serve',at:now+.2+Math.random()*.8};
    }
  }
  const rate=Math.max(.8,BASE*(.5+c.heat)*day.mul);
  const need=(!c.flipped?Math.max(0,cpu.t1-c.dB)+cpu.t2:Math.max(0,cpu.t2-c.dA))/rate;
  if(need>timeLeft-4) cpu.fanning=true;
}

function sideScore(d){ if(d<70)return Math.max(0,d/70*90); if(d<=90)return 100-Math.abs(d-80); return Math.max(0,90-(d-90)*3.5); }
function sideWord(d){ return d<55?'生':d<70?'ちょい生':d<=90?'ベスト':d<=102?'焼き強め':'焦げ'; }
function total(c){ return Math.max(0,Math.round((sideScore(c.dA)+sideScore(c.dB))/2-(c.served?0:10))); }
function plateWord(c){ return sideWord((c.dA+c.dB)/2); }
function closePlate(who){
  if(who.cook.served) return;
  const sc=total(who.cook);
  who.cook.served=true; who.cook.serveT=now;
  who.plates.push({score:sc,word:plateWord(who.cook),dA:who.cook.dA,dB:who.cook.dB});
}
function sumPlates(plates){ return plates.reduce((s,p)=>s+p.score,0); }
function plateLine(plates){ return plates.map((p,i)=>DISH[i].charAt(0)+p.word).join('　'); }

function paint(prefix,c){
  let hot=false;
  for(const s of ['A','B']){
    const d=c['d'+s]; if(d>90&&!c.served)hot=true;
    const f=$(prefix+s); f.style.width=Math.min(d,120)/120*100+'%';
    f.style.background='#'+dColor(d,tmpC).getHexString();
    const down=(s==='A')===c.flipped;
    $(prefix+s+'l').textContent=(down&&!c.served?'● ':'')+s+'面';
  }
  $(prefix+'Card').classList.toggle('hot',hot);
}
function setDishLabel(){ $('timer').querySelector('small').textContent=DISH[Math.min(player.plates.length,PLATES-1)]; }
function setButtons(){
  const on=state==='play'&&!player.cook.served;
  $('fan').disabled=$('flip').disabled=$('serve').disabled=!on;
}
function beginDish(){
  player.cook=newCook(); cpu.cook=newCook(); resetCpu();
  timeLeft=ROUND; endTimer=0; holding=false; $('fan').classList.remove('on');
  stopWind(); scheduleWind();
  setDishLabel(); setButtons();
}

function start(){
  initAudio(); if(actx&&actx.state==='suspended')actx.resume();
  clearEnding();
  clearTimeout(judgementTimer); $('judgement').hidden=true;
  player.plates=[]; cpu.plates=[];
  state='play';
  $('title').hidden=true; $('ending').hidden=true;
  $('hud').hidden=false; $('pad').hidden=false;
  $('againBtn').hidden=true; $('endFinal').hidden=true;
  beginDish(); say(weatherLine());
}
function finish(){
  state='judgement'; setButtons(); holding=false; $('fan').classList.remove('on'); stopWind();
  $('hud').hidden=true; $('pad').hidden=true;
  const ps=sumPlates(player.plates), cs=sumPlates(cpu.plates);
  const best=Math.max(ps, parseInt(lsGet(LS.best,'0'),10)||0);
  lsSet(LS.best,best);
  showJudgement(ps,cs);
}
function advanceOrFinish(){
  if(player.plates.length>=PLATES && cpu.plates.length>=PLATES){ finish(); return; }
  beginDish();
  say(DISH[player.plates.length]+'、いくぞ');
}

    const avg=((p.dA||0)+(p.dB||0))/2;
    const marks=Math.max(0,Math.min(5,Math.floor((avg-55)/10)));
    for(let m=0;m<marks;m++) svg.appendChild(make('path',{d:`M${48+m*12} 13l-8 21`,stroke:avg>102?'#160c08':'#5b321c','stroke-width':avg>102?'3.2':'2','stroke-linecap':'round',opacity:'.7'}));
    svg.appendChild(make('circle',{cx:'122',cy:'21',r:'3.5',fill:'#e8dfcc',stroke:'#2a1810','stroke-width':'1'}));
    svg.appendChild(make('circle',{cx:'123',cy:'21',r:'1.6',fill:'#111'}));
    svg.appendChild(make('path',{d:'M133 25q-5 3-10 0',fill:'none',stroke:'#2a1810','stroke-width':'1'}));
    dish.appendChild(svg); wrap.appendChild(dish);
  }
}
function endingLine(who,text){
  $('endWho').textContent=who; $('endLine').textContent=text;
}
function guestEat(i){
  const g=$('g'+i);
  g.classList.add('on','eat');
  later(450,()=>g.classList.remove('eat'));
  const dish=$('endPlates').children[i]; if(dish) dish.classList.add('eaten');
  const plate=player.plates[i]||{word:'生'};
  const guest=GUESTS[i];
  endingLine(guest.name, guest.lines[plate.word]||guest.lines['ちょい生']);
  if(navigator.vibrate) navigator.vibrate(12);
}
function endingFinale(){
  const nBest=player.plates.filter(p=>p.word==='ベスト').length;
  const nBad=player.plates.filter(p=>p.word==='生'||p.word==='焦げ').length;
  let text=nBest===3?'三人とも、黙って箸が進んだ。':nBest>=2?'二人は満足。一人は不服。':nBad>=2?'三人とも、皿を置いた。':'味は分かれた。明日の火だ。';
  if(endingPs>endingCs) text+=' ゲン「客の顔がいい」';
  else if(endingPs<endingCs) text+=' ゲン「うちの勝ちだな」';
  else text+=' ゲン「互角だ」';
  $('endFinal').textContent=text; $('endFinal').hidden=false;
  $('againBtn').hidden=false;
}
function playEndingBeat(){
  if(endingStep<PLATES){
    guestEat(endingStep);
    endingStep++;
    later(2200, playEndingBeat);
    return;
  }
  later(800, endingFinale);
}
function startEnding(ps,cs){
  clearEnding();
  endingPs=ps; endingCs=cs; endingStep=0;
  for(let i=0;i<PLATES;i++) $('g'+i).classList.remove('on','eat');
  $('endWho').textContent=''; $('endLine').textContent='三皿、お待ち。';
  $('endFinal').hidden=true; $('endFinal').textContent='';
  $('againBtn').hidden=true;
  paintPlates(player.plates);
  $('ending').hidden=false;
  later(600, playEndingBeat);
}
function showJudgement(ps,cs){
  clearTimeout(judgementTimer);
  endingPs=ps; endingCs=cs;
  $('judgeWinner').textContent=ps>cs?'あなたの勝利！':ps<cs?'焼き場のゲンの勝利！':'両者引き分け！';
  $('judgement').hidden=false;
  judgementTimer=setTimeout(skipJudgement,2600);
}
function skipJudgement(){
  if(state!=='judgement') return;
  clearTimeout(judgementTimer); $('judgement').hidden=true;
  state='ending'; startEnding(endingPs,endingCs);
}
function endingNext(){
  if(!$('againBtn').hidden) return;
  endingTimers.forEach(clearTimeout); endingTimers=[];
  for(let i=0;i<PLATES;i++){
    $('g'+i).classList.add('on');
    const dish=$('endPlates').children[i]; if(dish) dish.classList.add('eaten');
  }
  const last=player.plates[PLATES-1];
  if(last) endingLine(GUESTS[2].name, GUESTS[2].lines[last.word]||GUESTS[2].lines['ちょい生']);
  endingStep=PLATES;
  endingFinale();
}

// ---------- コントロールパネル ----------
function setMute(v){
  muted=v; lsSet(LS.muted, muted?'1':'0');
  const b=$('btnMute');
  b.setAttribute('aria-pressed', muted?'true':'false');
  b.textContent = muted?'🔇':'♪';
  $('btnMuteDlg').textContent = '音: ' + (muted?'オフ':'オン');
}
function pauseGame(){
  if(state!=='play')return;
  state='paused'; holding=false; $('fan').classList.remove('on'); setButtons();
  const d=$('pauseDlg'); if(!d.open && typeof d.showModal==='function') d.showModal();
}
function resumeGame(){
  if(state!=='paused')return;
  const d=$('pauseDlg'); if(d.open) d.close();
  state='play'; clock.getDelta(); setButtons();
}
function quitToTitle(){
  const d=$('pauseDlg'); if(d.open) d.close();
  state='title'; holding=false; $('fan').classList.remove('on'); stopWind();
  player.plates=[]; cpu.plates=[]; player.cook=newCook(); cpu.cook=newCook();
  timeLeft=ROUND; setDishLabel();
  clearEnding();
  $('ending').hidden=true; $('hud').hidden=false; $('pad').hidden=false;
  $('title').hidden=false; setButtons();
}
$('btnMute').addEventListener('click',()=>setMute(!muted));
$('btnMuteDlg').addEventListener('click',()=>setMute(!muted));
$('btnPause').addEventListener('click',()=>{ state==='paused'?resumeGame():pauseGame(); });
$('btnResume').addEventListener('click',resumeGame);
$('btnQuit').addEventListener('click',quitToTitle);
$('pauseDlg').addEventListener('cancel',e=>{ e.preventDefault(); resumeGame(); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });
setMute(muted);

// input
let lastTouchEnd=0;
document.addEventListener('touchend',e=>{ const t=Date.now(); if(t-lastTouchEnd<=300) e.preventDefault(); lastTouchEnd=t; },{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>{ if(e.target.closest('[data-scrollable]')) return; e.preventDefault(); },{passive:false});
function tap(el,handler){
  const fire=e=>{ if(el.disabled) return; e.preventDefault(); el.classList.add('is-pressed'); if(navigator.vibrate) navigator.vibrate(14); handler(e); };
  const rel=()=>el.classList.remove('is-pressed');
  el.addEventListener('pointerdown',fire);
  el.addEventListener('pointerup',rel);
  el.addEventListener('pointercancel',rel);
  el.addEventListener('pointerleave',rel);
}
const fanBtn=$('fan');
fanBtn.addEventListener('pointerdown',e=>{ if(fanBtn.disabled)return; e.preventDefault(); try{fanBtn.setPointerCapture(e.pointerId);}catch(_){} holding=true; fanBtn.classList.add('on'); if(navigator.vibrate) navigator.vibrate(12); player.cook.heat=Math.min(HEAT_MAX,player.cook.heat+.04); flapNow(); });
['pointerup','pointerleave','pointercancel'].forEach(ev=>fanBtn.addEventListener(ev,()=>{holding=false;fanBtn.classList.remove('on');}));
tap($('flip'),()=>{ if(state==='play') doFlip(player.cook); });
tap($('serve'),()=>{ if(state==='play'&&!player.cook.served){ closePlate(player); setButtons(); if(!cpu.cook.served) say('お、早いな。どれどれ…'); }});
tap($('startBtn'),start);
tap($('againBtn'),start);
$('ending').addEventListener('pointerdown',e=>{
  if(e.target.closest('#againBtn')) return;
  if(state==='ending') endingNext();
});
$('judgement').addEventListener('pointerdown',skipJudgement);
addEventListener('keydown',e=>{
  if(e.key==='Escape'||e.key==='p'||e.key==='P'){ e.preventDefault(); state==='paused'?resumeGame():pauseGame(); return; }
  if(state==='paused') return;
  if(state==='judgement'){ e.preventDefault(); skipJudgement(); return; }
  if(state==='ending'){
    e.preventDefault();
    if(!$('againBtn').hidden){ if(e.key==='Enter') start(); }
    else endingNext();
    return;
  }
  if(state!=='play'){ if(e.key==='Enter'){ e.preventDefault(); start(); } return; }
  if(e.code==='Space'){ e.preventDefault(); if(!player.cook.served && !e.repeat){ holding=true; fanBtn.classList.add('on'); flapNow(); } }
  if(e.key==='f'||e.key==='F') doFlip(player.cook);
  if(e.key==='Enter'&&!player.cook.served){ closePlate(player); setButtons(); }
});
addEventListener('keyup',e=>{ if(e.code==='Space'){holding=false;fanBtn.classList.remove('on');} });

// camera fit
function fit(){
  const w=innerWidth,h=innerHeight,a=w/h; renderer.setSize(w,h);
  const portrait=a<1;
  camera.fov=portrait?58:42; camera.aspect=a;
  const gap=portrait?1.0:1.55;
  stoves[0].g.position.x=-gap; stoves[1].g.position.x=gap;
  const hf=2*Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov)/2)*a);
  const d=Math.max(portrait?6:5.4,(gap+1.45)/Math.tan(hf/2));
  camera.position.set(0,d*.8,d*.6);
  camera.lookAt(0,portrait?.55:.7,portrait?-.1:.15);
  scene.fog.near=d*1.1; scene.fog.far=d*2.8;
  camera.updateProjectionMatrix();
}
addEventListener('resize',fit); fit();

// ---------- loop ----------
const clock=new THREE.Clock();
const cooks=()=>[player.cook,cpu.cook];
function frame(){
  requestAnimationFrame(frame);
  let dt=Math.min(clock.getDelta(),.05);
  if(state==='paused') dt=0;
  now+=dt;

  if(state==='play'){
    timeLeft-=dt;
    updateWind();
    cookStep(player.cook,dt,holding&&!player.cook.served);
    cookStep(cpu.cook,dt,cpu.fanning&&!cpu.cook.served);
    cpuThink(dt);
    flapBusy=Math.max(0,flapBusy-dt*1.6);
    if(holding&&!player.cook.served){
      flapPhase+=dt*(3.4+player.cook.heat*5.5+flapBusy*9);
      while(flapPhase>=1){ flapPhase--; flapNow(); }
    }else flapPhase=0;
    if(timeLeft<=0){
      timeLeft=0;
      closePlate(player); closePlate(cpu);
      advanceOrFinish();
    }else if(player.cook.served&&cpu.cook.served){
      endTimer+=dt; if(endTimer>.8) advanceOrFinish();
    }
  }
  $('timer').firstChild.nodeValue=Math.ceil(timeLeft);

  cooks().forEach((c,i)=>{
    const st=stoves[i], f=fishes[i], heat=c.heat;
    const flick=Math.sin(now*9+i*2)*.08+Math.sin(now*23+i)*.05;
    st.coalMats[0].emissiveIntensity=.65+heat*1.1+flick;
    st.coalMats[1].emissiveIntensity=.55+heat*1.0-flick;
    st.windowMat.emissiveIntensity=.4+heat*1.2+flick;
    st.light.intensity=1+heat*1.6+flick*2;

    const u=uchiwas[i]; u.phase+=dt*(2.5+heat*22);
    u.arm.rotation.x=-.35+Math.sin(u.phase)*(.05+heat*.6);
    u.arm.rotation.z=-u.side*.12;

    // flip animation
    const target=c.flipped?Math.PI:0;
    const diff=target-c.rot; c.rot+=Math.sign(diff)*Math.min(Math.abs(diff),dt*7);
    f.flip.rotation.x=c.rot;
    const lift=Math.sin(c.rot)*.45;
    const served=c.served?Math.min(1,(now-c.serveT)*2):0;
    f.holder.position.y=1.08+lift+served*(.55+Math.sin(now*2+i)*.04);

    dColor(c.dA,f.mA.color); dColor(c.dB,f.mB.color);
    f.mA.metalness=.35*(1-Math.min(c.dA,60)/60); f.mA.roughness=.35+Math.min(c.dA,120)/120*.55;
    f.mB.metalness=.35*(1-Math.min(c.dB,60)/60); f.mB.roughness=.35+Math.min(c.dB,120)/120*.55;
    dColor((c.dA+c.dB)/2*1.05,f.tailMat.color).multiplyScalar(.85);
    f.eyeA.color.set(0x111111).lerp(tmpC.set(0xeeeae0),Math.min(1,Math.max(0,(c.dA-35)/35)));
    f.eyeB.color.set(0x111111).lerp(tmpC.set(0xeeeae0),Math.min(1,Math.max(0,(c.dB-35)/35)));

    if(state==='play'||state==='ending'){
      const maxD=Math.max(c.dA,c.dB);
      const rate=(c.served?.4:1)*(.4+maxD/35)*(.7+heat*1.2);
      if(Math.random()<rate*dt*3){
        const x=st.g.position.x+(Math.random()-.5)*.8;
        spawn(false,x,1.2+f.holder.position.y-1.08,(Math.random()-.5)*.4,maxD>100&&Math.random()<.7);
      }
      if(heat>.25&&Math.random()<heat*dt*14){
        spawn(true,st.g.position.x+(Math.random()-.5)*.9,1.0,(Math.random()-.5)*.9);
      }
    }
  });

  updateParts(dt);

  if(state==='play'){ paint('p',player.cook); paint('c',cpu.cook); }

  if(sizGain&&actx){
    const p=player.cook;
    let g=0;
    if(state==='play'){ g=(p.served?.008:.025+.05*p.heat)+(cpu.cook.served?0:.012); }
    g+=sizzleKick; sizzleKick=Math.max(0,sizzleKick-dt*.4);
    if(muted) g=0;
    sizGain.gain.setTargetAtTime(g,actx.currentTime,.05);
  }

  // idle camera sway on title
  if(state==='title'){ camera.position.x=Math.sin(now*.4)*.6; camera.lookAt(0,.7,0); }
  else if(Math.abs(camera.position.x)>.001){ camera.position.x*=.9; fit(); }

  renderer.render(scene,camera);
}
frame();
if(location.hash==='#ending'){
  player.plates=[
    {score:95,word:'ベスト',dA:82,dB:78},
    {score:58,word:'ちょい生',dA:64,dB:60},
    {score:18,word:'焦げ',dA:112,dB:104}
  ];
  cpu.plates=[{score:80,word:'ベスト',dA:80,dB:80},{score:80,word:'ベスト',dA:80,dB:80},{score:80,word:'ベスト',dA:80,dB:80}];
  $('title').hidden=true;
  finish();
}
</script>
